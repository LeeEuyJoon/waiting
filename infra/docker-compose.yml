services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waiting
      POSTGRES_USER: waiting
      POSTGRES_PASSWORD: waiting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waiting"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-server-1:
    build:
      context: ../backend
      dockerfile: api-server/Dockerfile
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/waiting
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-server-2:
    build:
      context: ../backend
      dockerfile: api-server/Dockerfile
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/waiting
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  sse-server-1:
    build:
      context: ../backend
      dockerfile: sse-server/Dockerfile
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  sse-server-2:
    build:
      context: ../backend
      dockerfile: sse-server/Dockerfile
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  admission-worker:
    build:
      context: ../backend
      dockerfile: admission-worker/Dockerfile
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-server-1
      - api-server-2
      - sse-server-1
      - sse-server-2