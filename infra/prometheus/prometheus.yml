global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'api-server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-server-1:8080', 'api-server-2:8080']

  - job_name: 'sse-server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['sse-server-1:8081', 'sse-server-2:8081']

  - job_name: 'admission-worker'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['admission-worker:8080']